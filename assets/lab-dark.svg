<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Lab architecture: an outside attacker VM, a router and firewall between seven zones (DMZ edge, App, Internal, SOC, User, Admin, Remote), network taps from the SOC&#x27;s IDS into the DMZ, App and Internal zones, and Wazuh agents on every host." font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><rect width="1200" height="640" rx="12" fill="#161b22" stroke="#30363d"/><rect x="40" y="34" width="300" height="100" rx="10" fill="#0d1117" stroke="#ec835a" stroke-width="1.5"/><text x="60.0" y="66.0" font-size="19" font-weight="650" fill="#ffffff" text-anchor="start">Outside (WAN)</text><text x="60.0" y="94.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">attacker VM for red-team tests</text><text x="60.0" y="119.0" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start">only the DMZ and VPN face it</text><line x1="190" y1="134" x2="190" y2="182" stroke="#ec835a" stroke-width="2"/><path d="M184,173 L190,182 L196,173" fill="none" stroke="#ec835a" stroke-width="2"/><text x="1160.0" y="62.0" font-size="20" font-weight="650" fill="#ffffff" text-anchor="end">17 VMs · 7 firewalled zones</text><text x="1160.0" y="92.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="end">Windows Active Directory + Linux services</text><text x="1160.0" y="120.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="end">DCs hardened to CIS Level 1 (28% → 92%), AppLocker, 3-tier PKI</text><rect x="40" y="190" width="1120" height="46" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/><text x="600.0" y="220.0" font-size="18" font-weight="650" fill="#ffffff" text-anchor="middle">router + firewall between every zone: default deny</text><line x1="127.5" y1="236" x2="127.5" y2="270" stroke="#30363d" stroke-width="1.5"/><rect x="40.0" y="270" width="175.0" height="200" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/><text x="54.0" y="302.0" font-size="19" font-weight="650" fill="#ffffff" text-anchor="start">DMZ edge</text><text x="54.0" y="326.0" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start">internet-facing</text><text x="54.0" y="360.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">WAF</text><text x="54.0" y="385.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">read-only DC</text><text x="54.0" y="410.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">public DNS</text><text x="54.0" y="435.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">bastion</text><line x1="316.5" y1="236" x2="316.5" y2="270" stroke="#30363d" stroke-width="1.5"/><rect x="229.0" y="270" width="175.0" height="200" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/><text x="243.0" y="302.0" font-size="19" font-weight="650" fill="#ffffff" text-anchor="start">App</text><text x="243.0" y="326.0" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start">only via the WAF</text><text x="243.0" y="360.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">web server</text><text x="243.0" y="385.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">web shop</text><line x1="505.5" y1="236" x2="505.5" y2="270" stroke="#30363d" stroke-width="1.5"/><rect x="418.0" y="270" width="175.0" height="200" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/><text x="432.0" y="302.0" font-size="19" font-weight="650" fill="#ffffff" text-anchor="start">Internal</text><text x="432.0" y="326.0" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start">never exposed</text><text x="432.0" y="360.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">domain controller</text><text x="432.0" y="385.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">internal DNS</text><text x="432.0" y="410.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">certificate authority</text><text x="432.0" y="435.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">collab server</text><line x1="694.5" y1="236" x2="694.5" y2="270" stroke="#30363d" stroke-width="1.5"/><rect x="607.0" y="270" width="175.0" height="200" rx="10" fill="#13263d" stroke="#3987e5" stroke-width="1.5"/><text x="621.0" y="302.0" font-size="19" font-weight="650" fill="#ffffff" text-anchor="start">SOC</text><text x="621.0" y="326.0" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start">logs in, admin only</text><text x="621.0" y="360.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">Wazuh SIEM</text><text x="621.0" y="385.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">IDS sensor:</text><text x="621.0" y="410.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">Zeek + Suricata</text><line x1="883.5" y1="236" x2="883.5" y2="270" stroke="#30363d" stroke-width="1.5"/><rect x="796.0" y="270" width="175.0" height="200" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/><text x="810.0" y="302.0" font-size="19" font-weight="650" fill="#ffffff" text-anchor="start">User · Admin</text><text x="810.0" y="326.0" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start">two separate zones</text><text x="810.0" y="360.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">Windows 10 PC</text><text x="810.0" y="385.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">admin PC, which</text><text x="810.0" y="410.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">reaches servers</text><text x="810.0" y="435.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">via the bastion</text><line x1="1072.5" y1="236" x2="1072.5" y2="270" stroke="#30363d" stroke-width="1.5"/><rect x="985.0" y="270" width="175.0" height="200" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/><text x="999.0" y="302.0" font-size="19" font-weight="650" fill="#ffffff" text-anchor="start">Remote</text><text x="999.0" y="326.0" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start">remote access</text><text x="999.0" y="360.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="start">VPN gateway</text><line x1="127.5" y1="508" x2="694.5" y2="508" stroke="#3987e5" stroke-width="2.5"/><line x1="127.5" y1="470" x2="127.5" y2="508" stroke="#3987e5" stroke-width="2.5"/><line x1="316.5" y1="470" x2="316.5" y2="508" stroke="#3987e5" stroke-width="2.5"/><line x1="505.5" y1="470" x2="505.5" y2="508" stroke="#3987e5" stroke-width="2.5"/><line x1="694.5" y1="470" x2="694.5" y2="508" stroke="#3987e5" stroke-width="2.5"/><path d="M688.5,480 L694.5,470 L700.5,480" fill="none" stroke="#3987e5" stroke-width="2.5"/><text x="411.0" y="538.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="middle">network taps: a Zeek worker per zone, plus Suricata (ET Open rules)</text><text x="923.5" y="510.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="middle">Wazuh agents on every host</text><text x="923.5" y="534.0" font-size="16" font-weight="400" fill="#c3c2b7" text-anchor="middle">send their logs to the SIEM</text><text x="600.0" y="618.0" font-size="17" font-weight="650" fill="#3987e5" text-anchor="middle">Goal: one attack raises one specific alert, not a wall of noise</text></svg>
