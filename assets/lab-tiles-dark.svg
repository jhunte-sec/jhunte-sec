<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 204" width="1200" height="204" role="img" aria-label="Lab results: one attack raises one specific alert; alerts are triaged and a weekly threat hunt runs; domain controllers went from 28% to 92% on the CIS Level 1 benchmark, plus AppLocker and a three-tier PKI." font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><rect x="1.0" y="1" width="386.0" height="202" rx="14" fill="#161b22" stroke="#30363d"/><rect x="1.0" y="1" width="386.0" height="5" rx="2.5" fill="#3987e5"/><rect x="26.0" y="30" width="52" height="52" rx="14.6" fill="#132741"/><g transform="translate(37.4,41.4) scale(1.213)" fill="none" stroke="#3987e5" stroke-width="1.57" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></g><text x="94.0" y="68" font-size="32" font-weight="700" fill="#ffffff">1 attack<tspan fill="#c9d1d9" font-weight="400"> → </tspan><tspan fill="#3987e5">1 alert</tspan></text><text x="28.0" y="128.0" font-size="20" font-weight="400" fill="#c9d1d9" text-anchor="start">each test attack raises one</text><text x="28.0" y="158.0" font-size="20" font-weight="400" fill="#c9d1d9" text-anchor="start">specific alert, not a pile</text><rect x="407.0" y="1" width="386.0" height="202" rx="14" fill="#161b22" stroke="#30363d"/><rect x="407.0" y="1" width="386.0" height="5" rx="2.5" fill="#3987e5"/><rect x="432.0" y="30" width="52" height="52" rx="14.6" fill="#132741"/><g transform="translate(443.4,41.4) scale(1.213)" fill="none" stroke="#3987e5" stroke-width="1.57" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></g><text x="500.0" y="68.0" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">Triage + hunt</text><text x="434.0" y="128.0" font-size="20" font-weight="400" fill="#c9d1d9" text-anchor="start">alerts closed with a reason,</text><text x="434.0" y="158.0" font-size="20" font-weight="400" fill="#c9d1d9" text-anchor="start">plus a weekly threat hunt</text><rect x="813.0" y="1" width="386.0" height="202" rx="14" fill="#161b22" stroke="#30363d"/><rect x="813.0" y="1" width="386.0" height="5" rx="2.5" fill="#3987e5"/><rect x="838.0" y="30" width="52" height="52" rx="14.6" fill="#132741"/><g transform="translate(849.4,41.4) scale(1.213)" fill="none" stroke="#3987e5" stroke-width="1.57" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></g><text x="906.0" y="68" font-size="32" font-weight="700" fill="#8b949e">28%<tspan fill="#c9d1d9" font-weight="400"> → </tspan><tspan fill="#3987e5">92%</tspan></text><text x="840.0" y="128.0" font-size="20" font-weight="400" fill="#c9d1d9" text-anchor="start">DCs on CIS Level 1, plus</text><text x="840.0" y="158.0" font-size="20" font-weight="400" fill="#c9d1d9" text-anchor="start">AppLocker and a 3-tier PKI</text></svg>
